[phases.setup]
nixPkgs = ["python313", "python313Packages.pip", "gcc"]

[phases.install]
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r requirements.txt"]

[start]
cmd = "python3 -m gunicorn server:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1"

[variables]
NIXPACKS_NO_DETECT = "1"
